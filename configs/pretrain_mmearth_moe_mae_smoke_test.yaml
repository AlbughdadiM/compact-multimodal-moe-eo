model:
  size: S
  img_size: 64
  patch_size: 4
  moe_balance_weight: 0.01

training:
  dataset_name: mmearth
  dataset_path: data/MMEarth64
  dataset_subset: MMEarth64
  raster_modalities: [sentinel2, sentinel1_asc, sentinel1_desc]
  metadata_modalities: [lat, lon, month, era5]
  modality_bands:
    sentinel1_asc: [VV, VH]
    sentinel1_desc: [VV, VH]
  structured_modality_dropout_prob: 0.1
  modality_loss_weights:
    sentinel2: 1.0
    sentinel1_asc: 1.0
    sentinel1_desc: 1.0
  normalization_mode: z-score
  fill_value: 0.0
  fallback_split_from_train: true
  val_fraction: 0.01
  test_fraction: 0.0
  split_seed: 42
  seed: 42

  epochs: 1
  batch_size: 128
  val_batch_size: 128
  learning_rate: 0.0003
  warmup_ratio: 0.05
  validation_mask_seed: 44
  weight_decay: 0.05
  num_workers: 6
  max_train_samples: 1024
  max_val_samples: 256
  subset_sample_seed: 42
  save_every_n_epochs: 1
  milestone_epochs: [1]
  weight_path: outputs/pretraining/smoke_test
